<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATTENDIX - Smart Attendance System</title>

    <!-- ATTENDIX LOGIN CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ==================================================
         LOGIN CONTAINER
    =================================================== -->

    <div class="login-container">


        <div class="login-card">


            <!-- ==================================================
                 BRAND
            =================================================== -->

            <div class="brand">

                <div class="brand-icon">
                    A
                </div>

                <div class="brand-text">

                    <h1>
                        ATTENDIX
                    </h1>

                    <p>
                        Smart Attendance System
                    </p>

                </div>

            </div>


            <!-- ==================================================
                 LOGIN HEADER
            =================================================== -->

            <div class="login-header">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to continue to your dashboard
                </p>

            </div>


            <!-- ==================================================
                 LOGIN FORM
            =================================================== -->

            <form id="loginForm">


                <!-- ==================================================
                     ROLE
                =================================================== -->

                <div class="form-group">

                    <label for="role">
                        Login As
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select Role
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                        <option value="student">
                            Student
                        </option>

                    </select>

                </div>


                <!-- ==================================================
                     EMAIL
                =================================================== -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- ==================================================
                     PASSWORD
                =================================================== -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- ==================================================
                     ERROR MESSAGE
                =================================================== -->

                <div
                    id="errorMessage"
                    class="error-message"
                    style="display: none;"
                ></div>


                <!-- ==================================================
                     LOGIN BUTTON
                =================================================== -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >
                    Login
                </button>


            </form>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="login-footer">

                <p>
                    ATTENDIX Smart Attendance System
                </p>

                <span>
                    RFID Based Attendance
                </span>

            </div>


        </div>

    </div>


    <!-- ==================================================
         LOGIN JAVASCRIPT
         
         Firebase + Authentication + Role Redirect
         is handled inside js/app.js
    =================================================== -->

    <script
        type="module"
        src="js/app.js"
    ></script>


</body>

</html>
