<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#1769E0">

    <title>My Profile | ATTENDIX</title>

    <link rel="stylesheet"
        href="../css/student-dashboard.css">

    <style>

        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .profile-card {
            background: #ffffff;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 30px;
            box-shadow:
                0 4px 15px rgba(20, 40, 80, 0.06);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #E5E7EB;
        }

        .large-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #EFF6FF;
            color: #1769E0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
        }

        .profile-header h2 {
            margin: 0 0 5px;
            color: #172033;
        }

        .profile-header p {
            margin: 0;
            color: #6B7280;
            font-size: 13px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 18px;
        }

        .profile-field {
            border: 1px solid #E5E7EB;
            border-radius: 9px;
            padding: 16px;
            background: #FAFBFD;
        }

        .profile-field label {
            display: block;
            color: #6B7280;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 7px;
            text-transform: uppercase;
        }

        .profile-field strong {
            display: block;
            color: #172033;
            font-size: 14px;
            word-break: break-word;
        }

        .profile-note {
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 8px;
            background: #EFF6FF;
            color: #1769E0;
            font-size: 12px;
        }

        .loading-profile {
            text-align: center;
            padding: 40px;
            color: #6B7280;
        }

        @media (max-width: 650px) {

            .profile-card {
                padding: 20px;
            }

            .profile-header {
                align-items: flex-start;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .large-avatar {
                width: 65px;
                height: 65px;
                font-size: 25px;
            }
        }

    </style>

</head>


<body data-role="student">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-logo">
                A
            </div>

            <div class="brand-text">

                <h2>ATTENDIX</h2>

                <span>
                    Smart Attendance
                </span>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a
                href="student-dashboard.html"
                class="nav-item">

                <span class="nav-icon">
                    ⌂
                </span>

                <span>
                    Dashboard
                </span>

            </a>


            <a
                href="student-attendance.html"
                class="nav-item">

                <span class="nav-icon">
                    ▣
                </span>

                <span>
                    My Attendance
                </span>

            </a>


            <a
                href="student-timetable.html"
                class="nav-item">

                <span class="nav-icon">
                    ▦
                </span>

                <span>
                    My Timetable
                </span>

            </a>


            <a
                href="student-profile.html"
                class="nav-item active">

                <span class="nav-icon">
                    ●
                </span>

                <span>
                    My Profile
                </span>

            </a>

        </nav>


        <div class="sidebar-bottom">

            <button
                id="logoutBtn"
                class="logout-btn">

                <span>↪</span>

                <span>Logout</span>

            </button>

        </div>

    </aside>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="topbar-left">

                <h1>
                    My Profile
                </h1>

                <p>
                    View your registered student information
                </p>

            </div>


            <div class="topbar-right">

                <div class="user-info">

                    <div
                        id="userAvatar"
                        class="user-avatar">

                        S

                    </div>

                    <div class="user-details">

                        <strong id="userName">
                            Student
                        </strong>

                        <span id="userRole">
                            Student
                        </span>

                    </div>

                </div>

            </div>

        </header>


        <!-- CONTENT -->

        <section class="dashboard-content">


            <div class="profile-container">


                <div class="profile-card">


                    <!-- PROFILE HEADER -->

                    <div class="profile-header">

                        <div
                            id="largeAvatar"
                            class="large-avatar">

                            S

                        </div>


                        <div>

                            <h2 id="profileName">
                                Loading...
                            </h2>

                            <p id="profileClass">
                                Loading student information...
                            </p>

                        </div>

                    </div>


                    <!-- PROFILE INFORMATION -->

                    <div
                        id="profileGrid"
                        class="profile-grid">


                        <div class="loading-profile">

                            Loading profile...

                        </div>


                    </div>


                    <div class="profile-note">

                        🔒 Your profile information is managed
                        by the ATTENDIX administrator.

                    </div>


                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="../js/student-profile.js">
    </script>

</body>

</html>
