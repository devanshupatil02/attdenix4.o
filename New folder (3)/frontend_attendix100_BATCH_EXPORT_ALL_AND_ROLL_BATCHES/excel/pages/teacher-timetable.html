<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATTENDIX – My Timetable</title>

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../css/admin-timetable.css"
    >

</head>


<body data-role="teacher">


<!-- =========================================================
     SIDEBAR OVERLAY
========================================================= -->

<div
    class="sidebar-overlay"
    id="sidebarOverlay"
></div>


<!-- =========================================================
     SIDEBAR TOGGLE
========================================================= -->

<button
    class="sidebar-toggle"
    id="sidebarToggle"
    aria-label="Toggle sidebar"
>

    <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
    >

        <line
            x1="3"
            y1="6"
            x2="21"
            y2="6"
        />

        <line
            x1="3"
            y1="12"
            x2="21"
            y2="12"
        />

        <line
            x1="3"
            y1="18"
            x2="21"
            y2="18"
        />

    </svg>

</button>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside
    class="sidebar"
    id="sidebar"
>


    <!-- LOGO -->

    <a
        class="sidebar-logo"
        href="teacher.html"
    >

        <div class="sidebar-logo-icon">

            <svg
                width="20"
                height="20"
                viewBox="0 0 36 36"
                fill="none"
            >

                <path
                    d="M10 18C10 13.582 13.582 10 18 10C22.418 10 26 13.582 26 18C26 22.418 22.418 26 18 26"
                    stroke="white"
                    stroke-width="2.5"
                    stroke-linecap="round"
                />

                <path
                    d="M14 18L17 21L22 15"
                    stroke="white"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

        </div>


        <div class="sidebar-logo-text">

            <h2>ATTENDIX</h2>

            <span>Teacher Panel</span>

        </div>

    </a>


    <!-- NAVIGATION -->

    <nav class="sidebar-nav">


        <span class="nav-section-label">
            Main Menu
        </span>


        <!-- Dashboard -->

        <a href="teacher.html">

            <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <rect
                    x="3"
                    y="3"
                    width="7"
                    height="7"
                />

                <rect
                    x="14"
                    y="3"
                    width="7"
                    height="7"
                />

                <rect
                    x="3"
                    y="14"
                    width="7"
                    height="7"
                />

                <rect
                    x="14"
                    y="14"
                    width="7"
                    height="7"
                />

            </svg>

            Dashboard

        </a>


        <!-- My Students -->

        <a href="my-students.html">

            <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"
                />

                <circle
                    cx="9"
                    cy="7"
                    r="4"
                />

                <path
                    d="M23 21v-2a4 4 0 0 0-3-3.87"
                />

                <path
                    d="M16 3.13a4 4 0 0 1 0 7.75"
                />

            </svg>

            My Students

        </a>


        <!-- Timetable -->

        <a
            href="teacher-timetable.html"
            class="active"
        >

            <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="18"
                    rx="2"
                />

                <line
                    x1="16"
                    y1="2"
                    x2="16"
                    y2="6"
                />

                <line
                    x1="8"
                    y1="2"
                    x2="8"
                    y2="6"
                />

                <line
                    x1="3"
                    y1="10"
                    x2="21"
                    y2="10"
                />

            </svg>

            Timetable

        </a>


        <!-- Attendance -->

        <a href="teacher-attendance.html">

            <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M9 11l3 3L22 4"
                />

                <path
                    d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
                />

            </svg>

            Attendance

        </a>


        <!-- Reports -->

        <a href="teacher-reports.html">

            <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />

                <polyline
                    points="14 2 14 8 20 8"
                />

                <line
                    x1="16"
                    y1="13"
                    x2="8"
                    y2="13"
                />

                <line
                    x1="16"
                    y1="17"
                    x2="8"
                    y2="17"
                />

            </svg>

            Reports

        </a>


    </nav>


    <!-- LOGOUT -->

    <div class="sidebar-footer">

        <a href="../index.html">

            <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
                />

                <polyline
                    points="16 17 21 12 16 7"
                />

                <line
                    x1="21"
                    y1="12"
                    x2="9"
                    y2="12"
                />

            </svg>

            Logout

        </a>

    </div>


</aside>


<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<div class="main-content">


    <!-- =====================================================
         TOPBAR
    ====================================================== -->

    <header class="topbar">


        <div class="topbar-title">

            <h1>
                My Timetable
            </h1>

            <p id="pageSubtitle">
                Loading timetable...
            </p>

        </div>


        <div class="topbar-right">

            <div class="topbar-user">


                <div
                    class="user-avatar"
                    id="userAvatar"
                >
                    T
                </div>


                <div class="user-info">

                    <strong id="userName">
                        Teacher
                    </strong>

                    <span id="userRole">
                        Teacher
                    </span>

                </div>


            </div>

        </div>


    </header>


    <!-- =====================================================
         PAGE BODY
    ====================================================== -->

    <div class="page-body">


        <!-- =================================================
             STATS
        ================================================== -->

        <div class="stats-grid">


            <!-- TODAY'S CLASSES -->

            <div class="stat-card">

                <div class="stat-icon blue">

                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="3"
                            y="4"
                            width="18"
                            height="18"
                            rx="2"
                        />

                        <line
                            x1="16"
                            y1="2"
                            x2="16"
                            y2="6"
                        />

                        <line
                            x1="8"
                            y1="2"
                            x2="8"
                            y2="6"
                        />

                        <line
                            x1="3"
                            y1="10"
                            x2="21"
                            y2="10"
                        />

                    </svg>

                </div>


                <div class="stat-info">

                    <p>
                        Today's Classes
                    </p>

                    <h3 id="todayClasses">
                        —
                    </h3>

                </div>

            </div>


            <!-- COMPLETED -->

            <div class="stat-card">

                <div class="stat-icon green">

                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M9 11l3 3L22 4"
                        />

                    </svg>

                </div>


                <div class="stat-info">

                    <p>
                        Completed
                    </p>

                    <h3 id="completedClasses">
                        —
                    </h3>

                </div>

            </div>


            <!-- UPCOMING -->

            <div class="stat-card">

                <div class="stat-icon orange">

                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="10"
                        />

                        <polyline
                            points="12 6 12 12 16 14"
                        />

                    </svg>

                </div>


                <div class="stat-info">

                    <p>
                        Upcoming
                    </p>

                    <h3 id="upcomingClasses">
                        —
                    </h3>

                </div>

            </div>


            <!-- SUBJECTS -->

            <div class="stat-card">

                <div class="stat-icon purple">

                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"
                        />

                        <path
                            d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"
                        />

                    </svg>

                </div>


                <div class="stat-info">

                    <p>
                        Total Subjects
                    </p>

                    <h3 id="totalSubjects">
                        —
                    </h3>

                </div>

            </div>


        </div>


        <!-- =================================================
             WEEKLY SCHEDULE
        ================================================== -->

        <div class="section-card">


            <div class="section-header">

                <h2>
                    Weekly Schedule
                </h2>


                <span
                    id="scheduleSubtitle"
                    style="
                        font-size:13px;
                        color:#6b7280;
                    "
                >
                    Loading...
                </span>

            </div>


            <div
                class="section-body"
                style="padding:20px;"
            >


                <!-- Firebase will generate
                     Monday-Friday blocks here -->

                <div
                    class="timetable-grid"
                    id="timetableGrid"
                >

                    <div
                        style="
                            grid-column:1/-1;
                            text-align:center;
                            padding:40px;
                            color:#6b7280;
                        "
                    >

                        Loading timetable...

                    </div>

                </div>


            </div>

        </div>


    </div>


</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script
    type="module"
    src="../js/dashboard.js"
></script>


<script
    type="module"
    src="../js/teacher-timetable.js"
></script>


</body>

</html>
